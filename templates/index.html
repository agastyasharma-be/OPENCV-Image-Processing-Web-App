<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Processing App</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Image Processing App</h1>

        <p class="subtitle">
            Upload an image and apply OpenCV transformations
        </p>

        <form action="/process" method="POST" enctype="multipart/form-data">

            <label>Name</label>
            <input type="text" name="name" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Upload Image</label>
            <input type="file" name="image" accept="image/*" required>


            <h2>Crop</h2>

            <label>Crop Height</label>
            <input type="number" name="crop_height" value="500" min="1" required>

            <label>Crop Width</label>
            <input type="number" name="crop_width" value="500" min="1" required>


            <h2>Resize</h2>

            <label>Resize Height</label>
            <input type="number" name="resize_height" value="1000" min="1" required>

            <label>Resize Width</label>
            <input type="number" name="resize_width" value="1000" min="1" required>


            <button type="submit">
                Process Image
            </button>

        </form>

    </div>

</body>

</html>
